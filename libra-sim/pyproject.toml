[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "librashogi"
version = "0.0.1"
description = "天秤将棋の厳密シミュレータ（LibraShogi）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.define = { LIBRA_BUILD_TESTS = "OFF" }
wheel.packages = ["python/librashogi"]
