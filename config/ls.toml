# 本体 ls（~/libra-run/ls）の設定の正。ここを直して main に入れ、コンソールの停止 → 起動で効く
# （docs/runbook.md §設定の管理、2026-09-18）。中身は 2026-09-18 12:56 に動いていた設定をそのまま写したもので、
# 元は docs/ls2-config.toml（やり直しの系列の案。2026-09-17 のユーザーの決定、煙テストは docs/restart-plan.md §2 C3）。
# 値の出所と確かめる計測は docs/ls2-settings.md の表。学習データに関わる値を変えるときは CLAUDE.md 11 に従う。
run_id = "ls"
seed = 2

[net]
d_model = 320
n_layers = 8
n_heads = 8
d_ff = 1280
dropout = 0.0

[search]
full_sims = 96
fast_sims = 24
full_prob = 0.25
gumbel_m_full = 16
gumbel_m_fast = 8
c_visit = 50.0
c_scale = 1.0
gumbel_rescale = false   # mctx 形にするなら true と c_scale = 0.1（煙テストの後の比較で決める）
cpuct = 1.5
draw_value = 0.0
max_ply = 320
count_from_41 = true
policy_topk = 32
max_moves_per_game = 400
mate_nodes_root = 200
proof_nodes = 1000
proof_min_ply = 36

[selfplay]
n_games = 512
threads = 12
infer_dtype = "float16"
openings = ""            # 搾取者 lx はまだ無い（本体が伸び始めてから足す）
openings_prob = 0.1
openings_reload_seconds = 600

[train]
batch_size = 1024
lr = 0.0002
weight_decay = 0.0001
warmup_steps = 1000
replay_ratio = 1.0       # 4 → 1。各局面を平均 1 回だけ学習する（AlphaZero の約 1.2 回に近い。窓の記憶を抑える）
window_games = 100000    # 窓の最小
window_frac = 0.5        # 窓を総局数の 50% まで広げる（新規）
window_games_max = 2000000  # 上限 200 万局（実測 1 局 約 5 KB で約 10 GB。2026-09-19 の実測: 窓 109 万局でランナー全体の RSS 6.75 GB、空き 21 GB）
min_window_games = 2000
train_every_games = 256
policy_weight = 1.0
value_weight = 1.0
v41_weight = 0.5
lambda_z = 1.0           # 0.5 → 1.0。布石の価値目標を結果 z だけにする（2026-09-18 のユーザーの決定。比較で差は出ず、V̂41 は補助ヘッド v41_weight 0.5 に残る）
mirror_prob = 0.5
grad_clip = 1.0

[run]
checkpoint_minutes = 10
status_seconds = 30
chunk_games = 100
keep_checkpoints = 3
heldout_every_chunks = 20   # 5% のチャンクを学習に使わず held-out にする（新規）
heldout_games = 20000
gen_minutes = 0
gen_games = 20000           # 窓の中と held-out の一般化の物差し（新規）。2 万局ごと（時間ではなく局数で）
gen_positions = 4000

[auto]
enabled = true
every_games = 400000        # 40 万局ごとに archive と計測（本番。2026-09-18 に煙テスト合格で 100000 から。総局数の倍数で区切る）
eval_games = 0              # 直前比の 100 局はやめる（向きを逆に出した 9/16 の再発防止）
chain_eval = false
eval_sims = 96
eval_concurrent = 64
eval_threads = 4
anchor_games = 1000         # 100 → 1,000（幅 ±22 Elo）
anchor_rebaseline = 0.85
best_games = 1000           # 最強比（新規）
best_stall_alert = 3
# 固定の参照。80 万局の点で勝率が 80% を超えた参照は外す（縮んだ Elo で曲線を寝かせるだけで、
# 過去の行は eval/reference.jsonl に残るので曲線は短くならない。docs/scaling-2026-09-18.md §6.4）。
# ls-v1 は 90.25% で外した（2026-09-18）。win1m はちょうど 80% で、旧い点との橋なので 1 節目だけ残す。
# 3 つ目は 80 万局の archive。これから主に使う参照で、80% を超えたら次の archive を足して外す
reference_ckpts = ["~/libra-run/experiments/2026-09-17-window/win1m.pt", "~/libra-run/ls/checkpoints/archive/ckpt_000062426.pt"]
reference_games = 200
reference_rotate = 0.8      # 参照に 80% 以上勝ったら自動で外し、そのときの archive を参照にする（2026-09-18。手で入れ替えなくても物差しが天井に着かない）
reference_min = 1
# 外部計測（2026-09-20 に総取り替え。ユーザーの決定「方策ネット＋やねうら王/水匠5 での対外対局には限界が
# あるのでやめる。40 手目までは Elo 測定で測った最強 Libra 同士で行い、41 手目から 最強 Libra vs やねうら王/
# 水匠5 で対局する」）。docs/runbook.md §7.0、docs/decisions.md 同日。
# 布石（1〜40 手目）は計測に使う重み（＝Elo を測った最強 Libra）が両陣とも作る。同じ局面を先後入れ替えて
# 2 局ずつ打つので、布石の有利不利は打ち消し合う。相手は布石を指さないふつうの将棋エンジンでよくなる。
# なおこの形では**布石の強さは測らない**（両陣とも Libra が作るので打ち消し合う）。測るのは 41 手目以降の将棋
match_games = 40
match_fuseki = "self"
match_opponent = "~/fuseki-shogi-ai/vendor/YaneuraOu/source/YaneuraOu-by-gcc"
match_opponent_cwd = "~/fuseki-shogi-ai"
match_opponent_opt = "EvalDir=vendor/yaneuraou_eval,Threads=1,USI_Hash=256,USI_OwnBook=false,BookFile=no_book,EnteringKingRule=CSARule27"
# Libra 側は自己評価と同じ読み（[auto] eval_sims = 96、[search] mate_nodes_root = 200）にする。こうすると
# 外部計測の点が `libra rating` の目盛りに乗る。違う読みにすると「ハンデ付きの自分と相手」だけで閉じた塊に
# なり、強連結の条件で目盛りから丸ごと落ちる（2026-09-19〜20 のハンデ付きの計測が実際にそうだった）
match_go = "nodes 96"
match_libra_opt = "Mate_Nodes=200"
match_libra_standard = true
# 相手の読む量が段。1 手 100 万節点で 1 秒相当（Threads=1）。釣り合う段が分からないので、最初の 1 回は
# 4 段に 10 局ずつ分けて挟む（段ごとに Elo の別の点になる）。得点 0.4〜0.6 に入った段を次から 40 局で使う。
# アルファベータの探索は節点 2 倍で +50〜70 Elo と言われる（未確認）ので、この 4 段で 500〜700 Elo ぶん
match_go_opp = "nodes 1000, nodes 10000, nodes 100000, nodes 1000000"

[workers]
enabled = true              # vast.ai の自己対局ワーカーの局を取り込む（2026-09-17、煙テストの短縮。ユーザーの決定）。検査はブリッジが inbox に置く前に行う

[league]
enabled = false             # lx を足してから

[progress]
enabled = true
