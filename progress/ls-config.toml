# このファイルは `libra run` が作り直す。直接編集しても次の起動で上書きされる。
# 設定の正はリポジトリの origin/main:config/ls.toml（docs/runbook.md §設定の管理）。
# その PC だけの上書きは config.local.toml に置く。
run_id = "ls"
seed = 2

[net]
d_model = 320
n_layers = 8
n_heads = 8
d_ff = 1280
dropout = 0.0

[search]
full_sims = 96
fast_sims = 24
full_prob = 0.25
gumbel_m_full = 16
gumbel_m_fast = 8
c_visit = 50.0
c_scale = 1.0
gumbel_rescale = false
cpuct = 1.5
draw_value = 0.0
max_ply = 320
count_from_41 = true
policy_topk = 32
max_moves_per_game = 400
mate_nodes_root = 200
proof_nodes = 1000
proof_min_ply = 36
resign_threshold = 0.0
resign_runs = 1
resign_disable_prob = 0.1
resign_min_ply = 40
defer_root_proof = true

[selfplay]
n_games = 512
threads = 12
infer_dtype = "float16"
compile = "max-autotune"
openings = ""
openings_prob = 0.1
openings_reload_seconds = 600

[exploiter]
main_ckpt = ""
main_dtype = "float16"
main_source = ""
refresh_hours = 0.0
refresh_steps = 0
refresh_check_minutes = 5.0
opponent_prior = true
openings_out = ""
openings_minutes = 60.0
openings_chunks = 50
openings_moves = 12
pool_out = ""
pool_keep = 30

[league]
enabled = false
pool = ""
n_games = 64
threads = 4
recent = 30
switch_games = 256
pool_check_minutes = 10.0

[train]
batch_size = 1024
lr = 0.0002
weight_decay = 0.0001
warmup_steps = 1000
replay_ratio = 1.0
window_games = 100000
window_frac = 0.5
window_games_max = 2000000
min_window_games = 2000
train_every_games = 256
policy_weight = 1.0
value_weight = 1.0
v41_weight = 0.5
lambda_z = 1.0
mirror_prob = 0.5
grad_clip = 1.0
compile = "max-autotune"

[workers]
enabled = true
ingest_seconds = 10.0
max_lag_steps = 2000

[run]
checkpoint_minutes = 10
status_seconds = 30
chunk_games = 100
keep_checkpoints = 3
export_onnx = true
metrics_minutes = 5
calib_minutes = 60
calib_games = 20000
heldout_every_chunks = 20
heldout_games = 20000
gen_minutes = 0
gen_games = 20000
gen_positions = 4000

[auto]
enabled = true
every_games = 400000
eval_games = 0
eval_sims = 96
eval_concurrent = 64
eval_threads = 4
chain_eval = false
anchor_games = 1000
anchor_rebaseline = 0.85
best_games = 1000
best_stall_alert = 3
reference_ckpts = ["~/libra-run/experiments/2026-09-17-window/win1m.pt", "~/libra-run/ls/checkpoints/archive/ckpt_000062426.pt"]
reference_games = 200
reference_rotate = 0.8
reference_min = 1
match_games = 40
match_go = "nodes 400"
match_go_opp = "movetime 1000"
match_opponent_opt = "Threads=2,Fuseki_Rules=2"
match_libra_opt = ""

[progress]
enabled = true
repo = ""
branch = "progress"
dir = "progress"
push = true
heartbeat_minutes = 180
min_seconds = 120
metrics_points = 120
