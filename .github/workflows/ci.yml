name: ci
# linux: ビルドとテスト。windows-cross: 配布物の libra.exe と同じ mingw-w64（posix）でのクロスビルド（実行はしない）。
# 文書だけの変更（docs、Markdown、ライセンスの全文、NOTICE）では走らせない。テストは文書を読まない（2026-09-15）
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSES/**", "NOTICE"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSES/**", "NOTICE"]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip cmake ninja pybind11 pytest numpy onnx onnxruntime
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch ONNX Runtime (CPU, MIT; hash pinned in tools/fetch_onnxruntime.sh)
        run: tools/fetch_onnxruntime.sh linux-cpu
      - name: Build (libra-sim, libra-search, libra-engine)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR=$(python -c "import pybind11;print(pybind11.get_cmake_dir())") \
            -DLIBRA_ORT_DIR=$PWD/third_party/onnxruntime/onnxruntime-linux-x64-1.30.0
          cmake --build build
      - name: C++ tests (perft, rules)
        run: |
          ctest --test-dir build/libra-sim --output-on-failure
          ctest --test-dir build/libra-search --output-on-failure
      - name: Python tests
        env:
          PYTHONPATH: libra-sim/python:libra-search/python:libra-net:libra-league:libra-scale:libra-cloud
        run: python -m pytest -q libra-sim/tests/test_python.py libra-league/tests libra-net/tests libra-engine/tests libra-scale/tests libra-search/tests/test_external.py libra-search/tests/test_selfplay_threads.py libra-search/tests/test_selfplay_resign.py libra-cloud/tests

  console:
    # 管理コンソール（tools/windows/libra-console.ps1）の Elo の文言。ubuntu-latest には pwsh が入っている
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Console format tests (PowerShell)
        run: pwsh -NoProfile -File tools/windows/tests/console-format.tests.ps1

  windows-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 ninja-build
      - name: Fetch ONNX Runtime DirectML + DirectML (MIT / MSLT; hash pinned in tools/fetch_onnxruntime.sh)
        run: tools/fetch_onnxruntime.sh win-dml
      - name: Cross-build libra.exe
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-posix.cmake \
            -DLIBRA_BUILD_PYTHON=OFF -DLIBRA_BUILD_TESTS=OFF \
            -DLIBRA_ORT_DIR=$PWD/third_party/onnxruntime/onnxruntime-win-x64-directml-1.24.4
          cmake --build build-win
          ls -l build-win/libra-engine/
          test -f build-win/libra-engine/libra.exe && test -f build-win/libra-engine/DirectML.dll
